<!doctype html>
<html lang="en">
    <body>
        <main>
            <div class="hbo-card">
                <a data-testid="movie_tile" data-sonic-type="movie" aria-label="Movie Title. 1 of 5."></a>
            </div>
            <div class="hbo-card">
                <a data-testid="show_tile" data-sonic-type="show" aria-label="Show Title. 2 of 5."></a>
            </div>
            <div class="hbo-card">
                <a
                    data-testid="mini-series_tile"
                    data-sonic-type="mini-series"
                    aria-label="Mini Series Title. 3 of 5."
                ></a>
            </div>
            <div class="hbo-card">
                <a data-testid="video_tile" data-sonic-type="video" aria-label="Video Title. 4 of 5."></a>
            </div>
            <div class="hbo-card">
                <a data-testid="sport_tile" data-sonic-type="sport" aria-label="Sport Title. 5 of 5."></a>
            </div>
            <div class="hbo-card">
                <a
                    data-testid="continue-watching_tile"
                    data-sonic-type="video"
                    aria-label="Watch Continue Watching Show. Season 1, Episode 2: Episode Title. 1 of 2."
                ></a>
            </div>
            <div class="hbo-card">
                <a
                    data-testid="search_tile"
                    data-sonic-type="show"
                    aria-label="Search Grid Show. Row 1 of 8, Column 1 of 4"
                ></a>
            </div>
            <div class="hbo-card">
                <a
                    data-testid="top-ten_tile"
                    data-sonic-type="movie"
                    aria-label="Number 1: Top Ten Movie. 1 of 10."
                ></a>
            </div>
        </main>
    </body>
</html>
