version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          github-actions:
              patterns:
                  - '*'
      cooldown:
          default-days: 10

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          npm-patch:
              patterns:
                  - '*'
              update-types:
                  - patch
          npm-minor:
              patterns:
                  - '*'
              update-types:
                  - minor
          npm-major:
              patterns:
                  - '*'
              update-types:
                  - major
      cooldown:
          default-days: 10
          semver-patch-days: 5
          semver-minor-days: 10
          semver-major-days: 20
      ignore:
          # @typescript-eslint/parser requires typescript >=4.8.4 <6.1.0.
          # Lift this cap only after that range allows a newer TypeScript.
          - dependency-name: typescript
            versions:
                - ">=6.1.0"
