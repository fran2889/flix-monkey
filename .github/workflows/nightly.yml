name: Nightly Integration

on:
    schedule:
        - cron: '0 3 * * *' # 03:00 UTC daily
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: nightly-integration
    cancel-in-progress: false

jobs:
    test-integration:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24.x'
                  cache: 'npm'
            - run: npm ci --ignore-scripts
            - run: npm run test:integration
              env:
                  XMDB_API_KEY: ${{ secrets.XMDB_API_KEY }}
                  OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}

    external-doc-links:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Check external documentation links
              uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
              with:
                  # Override the offline default from .lychee.toml so remote
                  # URLs are checked once a day instead of on every pull request.
                  args: >-
                      --config .lychee.toml
                      --offline=false
                      '*.md' docs .github
                  fail: true
