name: Publish to Stores

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag to publish (e.g. v1.0.2)'
                required: true
                type: string

permissions:
    contents: read

jobs:
    publish-chrome:
        runs-on: ubuntu-latest
        environment: store-publish
        timeout-minutes: 10
        steps:
            - name: Validate release tag format
              env:
                  TAG: ${{ inputs.tag }}
              run: |
                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "Invalid tag: '$TAG'." >&2
                      echo "Expected vMAJOR.MINOR.PATCH, for example v1.7.0." >&2
                      exit 1
                  fi
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.tag }}
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '24.x'
                  cache: 'npm'
            - run: npm ci --ignore-scripts
            - name: Download Chrome artifact from release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ inputs.tag }}
              run: gh release download "$TAG" --pattern "FlixMonkey-$TAG-chrome.zip" --dir dist
            - name: Publish to Chrome Web Store
              env:
                  TAG: ${{ inputs.tag }}
                  EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
                  PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
                  CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
                  CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
                  REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
              run: npx --no-install chrome-webstore-upload --source "dist/FlixMonkey-$TAG-chrome.zip"

    publish-firefox:
        runs-on: ubuntu-latest
        environment: store-publish
        timeout-minutes: 15
        steps:
            - name: Validate release tag format
              env:
                  TAG: ${{ inputs.tag }}
              run: |
                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "Invalid tag: '$TAG'." >&2
                      echo "Expected vMAJOR.MINOR.PATCH, for example v1.7.0." >&2
                      exit 1
                  fi
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.tag }}
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '24.x'
            - name: Download Firefox artifacts from release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ inputs.tag }}
              run: gh release download "$TAG" --pattern "FlixMonkey-$TAG-firefox.xpi" --pattern "FlixMonkey-$TAG-source.zip" --dir dist
            - name: Unpack the released add-on
              env:
                  TAG: ${{ inputs.tag }}
              run: |
                  mkdir -p dist/firefox
                  unzip -o "dist/FlixMonkey-$TAG-firefox.xpi" -d dist/firefox
            # web-ext is intentionally not a devDependency: every published version
            # pulls in node-forge and shell-quote advisories, which would make the
            # 'npm run audit' CI gate permanently red. It is not bundled into the
            # extension. Install it outside the repository tree so the project's
            # minimatch override does not apply to web-ext's dependencies.
            - name: Install web-ext
              run: npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$RUNNER_TEMP/web-ext" web-ext@10.7.0
            - name: Publish to Firefox Add-ons
              env:
                  TAG: ${{ inputs.tag }}
                  WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
                  WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
              run: '"$RUNNER_TEMP/web-ext/node_modules/.bin/web-ext" sign --source-dir dist/firefox --channel listed --upload-source-code "dist/FlixMonkey-$TAG-source.zip" --approval-timeout 0'

    publish-greasyfork:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Validate release tag format
              env:
                  TAG: ${{ inputs.tag }}
              run: |
                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "Invalid tag: '$TAG'." >&2
                      echo "Expected vMAJOR.MINOR.PATCH, for example v1.7.0." >&2
                      exit 1
                  fi
            - name: Verify Greasy Fork serves the released version
              env:
                  TAG: ${{ inputs.tag }}
                  SCRIPT_ID: ${{ vars.GREASYFORK_SCRIPT_ID }}
              run: |
                  set -euo pipefail
                  expected="${TAG#v}"
                  if [[ -z "$SCRIPT_ID" ]]; then
                      echo "GREASYFORK_SCRIPT_ID is not set. See docs/STORE_PUBLISHING.md." >&2
                      exit 1
                  fi
                  meta_url="https://update.greasyfork.org/scripts/$SCRIPT_ID.meta.js"
                  if ! meta="$(curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 30 -H 'Cache-Control: no-cache' "$meta_url")"; then
                      echo "Could not fetch $meta_url." >&2
                      exit 1
                  fi
                  greasyfork_version="$(printf '%s\n' "$meta" | sed -n 's|^[[:space:]]*//[[:space:]]*@version[[:space:]]*||p' | head -n 1 | tr -d '\r')"
                  if [[ -z "$greasyfork_version" ]]; then
                      echo "Greasy Fork returned no @version from $meta_url." >&2
                      exit 1
                  fi
                  if [[ "$greasyfork_version" != "$expected" ]]; then
                      echo "Greasy Fork serves version '$greasyfork_version', expected '$expected'." >&2
                      echo "Check the release asset, the webhook delivery, and the listing sync URL, then re-run this job." >&2
                      exit 1
                  fi
                  echo "Greasy Fork serves version $expected."
