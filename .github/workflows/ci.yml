name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    type-check:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '24.x'
                  cache: 'npm'
            - run: npm ci --ignore-scripts
            - run: npm run type-check

    lint-and-audit:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Lint workflows
              run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '24.x'
                  cache: 'npm'
            - run: npm ci --ignore-scripts
            - run: npm run audit
            - run: npm run lint
            - run: npm run format:check

    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '24.x'
                  cache: 'npm'
            - run: npm ci --ignore-scripts
            - run: npm rebuild sharp
            - run: npm run build
            - name: Install web-ext
              run: npm install --no-save --no-package-lock --no-audit --no-fund web-ext@10.7.0
            - name: Lint Firefox extension
              run: npx --no-install web-ext lint --source-dir dist/firefox --warnings-as-errors

    test-unit:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '24.x'
                  cache: 'npm'
            - run: npm ci --ignore-scripts
            - run: npm run test:unit

    test-ui:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '24.x'
                  cache: 'npm'
            - run: npm ci --ignore-scripts
            - run: npm run test:ui

    test-coverage:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '24.x'
                  cache: 'npm'
            - run: npm ci --ignore-scripts
            - run: npm run test:coverage
            - name: Upload coverage results
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: coverage-report
                  path: coverage
                  retention-days: 7

    merge-gate:
        runs-on: ubuntu-latest
        if: always()
        needs: [type-check, lint-and-audit, build, test-unit, test-ui, test-coverage]
        steps:
            - name: Check for failures
              if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
              run: exit 1
            - run: echo "All required jobs succeeded!"
