name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    type-check:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '24.x'
                  cache: 'npm'
            - run: npm ci --ignore-scripts
            - run: npm run type-check

    lint-and-audit:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Lint workflows
              uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
              with:
                  version: '1.7.12'
                  pyflakes: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '24.x'
                  cache: 'npm'
            - run: npm ci --ignore-scripts
            - run: npm run audit
            - run: npm run lint
            - run: npm run format:check

    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '24.x'
                  cache: 'npm'
            - run: npm ci --ignore-scripts
            - run: npm rebuild sharp
            - run: npm run build
            - name: Lint Firefox extension
              # Errors fail the step; warnings are reported in the log. The script
              # resolves web-ext through npx, so the project dependency tree is untouched.
              run: npm run lint:firefox

    test-unit:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '24.x'
                  cache: 'npm'
            - run: npm ci --ignore-scripts
            - run: npm run test:unit

    test-ui:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '24.x'
                  cache: 'npm'
            - run: npm ci --ignore-scripts
            - run: npm run test:ui

    test-coverage:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '24.x'
                  cache: 'npm'
            - run: npm ci --ignore-scripts
            - run: npm run test:coverage
            - name: Upload coverage results
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: coverage-report
                  path: coverage
                  retention-days: 7

    merge-gate:
        runs-on: ubuntu-latest
        if: always()
        needs: [type-check, lint-and-audit, build, test-unit, test-ui, test-coverage]
        steps:
            - name: Check for failures
              if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
              run: exit 1
            - run: echo "All required jobs succeeded!"
