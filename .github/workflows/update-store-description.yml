name: Update Store Description

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths: ['docs/store-description.txt']

permissions:
    contents: read

concurrency:
    group: update-store-description
    cancel-in-progress: false

jobs:
    update-firefox-description:
        runs-on: ubuntu-latest
        if: github.repository == 'fran2889/flix-monkey'
        environment: store-publish
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '24.x'
                  cache: 'npm'

            - name: Update Firefox AMO description
              env:
                  AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
                  AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
                  AMO_ADDON_ID: ${{ vars.AMO_ADDON_ID }}
              run: node scripts/update-firefox-description.js
