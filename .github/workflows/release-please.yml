name: Release Please

on:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: release-please
    cancel-in-progress: false

jobs:
    release-please:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '24.x'
                  cache: 'npm'
            - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              id: app-token
              with:
                  # The action accepts the app ID or client ID as the JWT issuer.
                  client-id: ${{ secrets.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-issues: write
                  permission-pull-requests: write
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
              id: release
              with:
                  config-file: release-please-config.json
                  token: ${{ steps.app-token.outputs.token }}
            - name: Install dependencies
              if: ${{ steps.release.outputs.release_created }}
              run: npm ci --ignore-scripts
            - name: Rebuild native dependencies
              if: ${{ steps.release.outputs.release_created }}
              run: npm rebuild sharp
            - name: Build artifacts
              if: ${{ steps.release.outputs.release_created }}
              run: npm run build
            - name: Build source archive
              if: ${{ steps.release.outputs.release_created }}
              run: npm run package:source
            - name: Upload to Release
              if: ${{ steps.release.outputs.release_created }}
              run: gh release upload "${{ steps.release.outputs.tag_name }}" dist/*.zip dist/*.xpi dist/*.user.js
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
            - name: Publish Release
              if: ${{ steps.release.outputs.release_created }}
              run: gh release edit "${{ steps.release.outputs.tag_name }}" --draft=false
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
