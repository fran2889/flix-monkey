name: Release Please

on:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: release-please
    cancel-in-progress: false

jobs:
    release-please:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '24.x'
                  cache: 'npm'
            - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              id: app-token
              with:
                  client-id: ${{ secrets.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-issues: write
                  permission-pull-requests: write
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
              id: release
              with:
                  config-file: release-please-config.json
                  token: ${{ steps.app-token.outputs.token }}
            - name: Resolve release tag and state
              id: release-state
              env:
                  RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
                  RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
              run: |
                  version="v$(node -p "require('./package.json').version")"
                  tag="$RELEASE_TAG"
                  if [[ -z "$tag" ]]; then
                      tag="$version"
                  fi
                  if [[ "$tag" != "$version" ]]; then
                      echo "Release tag '$tag' does not match package.json version '$version'." >&2
                      exit 1
                  fi
                  should_build=false
                  if [[ "$RELEASE_CREATED" == "true" || "$RUN_ATTEMPT" -gt 1 ]]; then
                      if ! git fetch --no-tags origin "+refs/tags/$tag:refs/tags/$tag"; then
                          echo "Release tag '$tag' does not exist on origin." >&2
                          exit 1
                      fi
                      tag_sha="$(git rev-list -n 1 "refs/tags/$tag")"
                      if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
                          echo "Release tag '$tag' points to commit $tag_sha, not this run's commit $GITHUB_SHA." >&2
                          exit 1
                      fi
                      should_build=true
                  fi
                  {
                      echo "tag=$tag"
                      echo "should_build=$should_build"
                  } >> "$GITHUB_OUTPUT"
                  echo "Release tag: $tag"
                  echo "Build release assets: $should_build"
            - name: Install dependencies
              if: ${{ steps.release-state.outputs.should_build == 'true' }}
              run: npm ci --ignore-scripts
            - name: Rebuild native dependencies
              if: ${{ steps.release-state.outputs.should_build == 'true' }}
              run: npm rebuild sharp
            - name: Build artifacts
              if: ${{ steps.release-state.outputs.should_build == 'true' }}
              run: npm run build
            - name: Build source archive
              if: ${{ steps.release-state.outputs.should_build == 'true' }}
              run: npm run package:source
            - name: Upload to Release
              if: ${{ steps.release-state.outputs.should_build == 'true' }}
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  TAG: ${{ steps.release-state.outputs.tag }}
              run: gh release upload "$TAG" dist/*.zip dist/*.xpi dist/*.user.js --clobber
            - name: Publish Release
              if: ${{ steps.release-state.outputs.should_build == 'true' }}
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  TAG: ${{ steps.release-state.outputs.tag }}
              run: gh release edit "$TAG" --draft=false
