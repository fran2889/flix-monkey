# Documentation link checking (https://lychee.cli.rs).
#
# The pull-request gate runs offline: it validates local file targets and
# heading anchors without network access. The nightly job overrides `offline`
# to also check remote URLs.

offline = true
include_fragments = "anchor-only"
no_progress = true
max_concurrency = 8
max_retries = 2

# Rate limiting is not a dead link: hosts that throttle non-browser clients would
# otherwise fail the nightly run.
accept = ["200..=299", "429"]

# Release notes are generated by release-please and carry hundreds of compare
# links this gate does not own.
exclude_path = ["(^|/)CHANGELOG\\.md$"]
