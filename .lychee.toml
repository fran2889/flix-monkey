# Documentation link checking (https://lychee.cli.rs).
#
# The pull-request gate runs offline: it validates local file targets and
# heading anchors without network access. The nightly job overrides `offline`
# to also check remote URLs.

offline = true
include_fragments = "anchor-only"
no_progress = true
cache = false
max_concurrency = 8
max_retries = 2

# Many documentation hosts (badge services, extension stores, API homepages)
# return 403 or 429 to non-browser clients. Accept those so the nightly run
# reports only links that are actually gone: 404, 410, 5xx, or DNS failures.
accept = ["200..=299", "403", "429"]

exclude_path = [
    "(^|/)node_modules/",
    "(^|/)dist/",
    "(^|/)coverage/",
    "(^|/)\\.worktrees/",
]
